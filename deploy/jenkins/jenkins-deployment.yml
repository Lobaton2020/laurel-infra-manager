apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: prod
  labels:
    app: jenkins
  # Politica: este manifiesto NO contiene credenciales (API tokens, passwords,
  # client secrets, csrf tokens) en texto plano. Cualquier secreto que el pod
  # necesite (build token, registry password, etc) se inyecta desde un
  # Kubernetes Secret referenciado via env.valueFrom.secretKeyRef o
  # `kubectl set env --from=secret/...`.
  annotations:
    laurel.andreslobaton.top/no-credentials-in-manifest: "true"
spec:
  # replicas: 1 es obligatorio: el PVC jenkins-home es ReadWriteOnce y un
  # segundo pod no podria montar el mismo PV. Si en algun momento se
  # necesita HA, migrar a Longhorn RWX y subir replicas.
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      # Grace period generoso: kaniko puede estar empujando layers cuando
      # llega un SIGTERM, y queremos que termine la subida antes de morir.
      terminationGracePeriodSeconds: 60
      # Jenkins corre como uid 1000 dentro del contenedor y necesita
      # poder escribir en el volumen. Si el PV ya esta creado con otro
      # owner, el initContainer de fix-permissions lo corrige.
      # El container principal agrega capabilities CHOWN para que kaniko
      # pueda resetear ownership de archivos en /kaniko durante el build.
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          # Tag pinneado: `latest` rompe con frecuencia.
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Arreglando permisos del volumen..."
              mkdir -p /var/jenkins_home
              chown -R 1000:1000 /var/jenkins_home
              chmod -R 755 /var/jenkins_home
              echo "Permisos OK"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
        # Estrategia de build: kaniko (primario). El init container copia
        # el binario desde gcr.io/kaniko-project/executor:v1.23.2-debug y
        # monta /kaniko (emptyDir kaniko-work) como staging dir escribible.
        #
        # Podman NO esta disponible en esta imagen (jenkins/jenkins oficial)
        # y no es viable instalarlo via `kubectl apply` (los init containers
        # no pueden escribir al rootfs del container principal). Si en el
        # futuro se quiere podman como fallback en el cluster, hay que
        # build una imagen custom con podman o usar un sidecar container.
          # Kaniko ejecuta `docker build` sin daemon. Copiamos el binario
          # `/kaniko/executor` del image `:debug` (que lo trae ya extraido,
          # a diferencia de `:latest` que requiere sacarlo de wars) a un
          # emptyDir compartido con jenkins. Lo copiamos con DOS nombres
          # para que sirva tanto a jobs que llaman `/usr/local/kaniko/kaniko`
          # como a los existentes (`/usr/local/kaniko/executor`).
          # Tambien preparamos el dir de staging que el binario usa
          # internamente (hardcoded a `/kaniko`); jenkins lo monta
          # desde el mismo emptyDir en `/kaniko` -> queda escribible por
          # el uid 1000.
          image: gcr.io/kaniko-project/executor:v1.23.2-debug
          command:
            - sh
            - -c
            - |
              set -e
              echo "Instalando kaniko executor..."
              cp /kaniko/executor /shared-kaniko/kaniko
              cp /kaniko/executor /shared-kaniko/executor
              chmod 0755 /shared-kaniko/kaniko /shared-kaniko/executor
              mkdir -p /shared-kaniko/work
              chmod 1777 /shared-kaniko/work
              /shared-kaniko/kaniko --help >/dev/null || true
              echo "Kaniko instalado (bin en /shared-kaniko/{kaniko,executor})"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: kaniko-bin
              mountPath: /shared-kaniko
            - name: kaniko-work
              mountPath: /shared-kaniko/work
      containers:
        - name: jenkins
          image: jenkins/jenkins:2.516.3-lts-jdk21
          imagePullPolicy: IfNotPresent
          securityContext:
            # Kaniko NECESITA uid 0 (root) para hacer chown al rootfs
            # durante el unpacking de capas de la imagen base. Solo agregar
            # CAP_CHOWN NO alcanza: falla con
            #   "failed to get filesystem from image: chown /: operation not permitted"
            # porque ciertas operaciones de chown sobre el rootfs requieren
            # uid 0 real, no solo la capability.
            #
            # Trade-off de seguridad: Jenkins corre como root en este pod.
            # Mitigamos con:
            #   - readOnlyRootFilesystem: false (necesario para escribir)
            #   - allowPrivilegeEscalation: false (no setuid binaries)
            #   - Sin CAP_SYS_ADMIN, CAP_NET_ADMIN, etc. Solo lo que necesita
            #     jenkins + kaniko para funcionar.
            #   - Pod aislado: PVC dedicado, ingress con auth, build tokens
            #     para trigger.
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 50000
              name: agent
              protocol: TCP
          env:
            - name: JAVA_OPTS
              # Importante: -Dhudson.security.csrf.GlobalCrumbIssuerConfiguration.DISABLE_CSRF_PROTECTION=true
              # es un FLAG boolean (no un token). El backend dispara builds
              # con ?token=<build_token> en query string, que es la unica
              # auth que valida Jenkins en este modo (ver "Trigger builds
              # remotely" en la doc oficial). NO contiene credenciales aqui:
              # los build tokens viven en Secretes de k8s y el backend los
              # lee de ahi al armar el POST.
              # Heap: 1g es lo minimo sano con varios jobs + plugins;
              # lo bajo a 768m solo si el nodo se queda corto.
              value: "-Djenkins.install.runSetupWizard=false -Dhudson.security.csrf.GlobalCrumbIssuerConfiguration.DISABLE_CSRF_PROTECTION=true -Xmx1024m -Xms512m"
            - name: JENKINS_OPTS
              # Sin auth global: el backend hace requests anonimas para
              # job_exists / get_build_status; el trigger usa build token.
              # Si en algun momento necesitamos agregar SSO, lo cambiamos
              # a un init.groovy que cree el realm + estrategia con permisos.
              value: "--httpPort=8080"
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
            - name: init-scripts
              mountPath: /var/jenkins_home/init.groovy.d
            - name: kaniko-bin
              mountPath: /usr/local/kaniko
            # kaniko lee/escribe su staging dir en /kaniko (hardcoded en
            # el binario v1.23.2; --kaniko-dir no lo redirige). El init
            # container deja este dir world-writable.
            - name: kaniko-work
              mountPath: /kaniko
            - name: workspace
              mountPath: /workspace
            - name: kaniko-cache
              mountPath: /kaniko-cache
            - name: plugins-file
              mountPath: /usr/share/jenkins/ref/plugins.txt
              subPath: plugins.txt
          # startupProbe evita que readiness/liveness maten el pod durante
          # el primer boot de Jenkins (descarga plugins, descomprime war,
          # puede tardar 2-3 min en clusters lentos).
          startupProbe:
            httpGet:
              path: /api/json
              port: 8080
            periodSeconds: 10
            failureThreshold: 36  # 6 min totales de gracia
          readinessProbe:
            httpGet:
              # /api/json responde 200 cuando el server esta listo
              # (sin redirect a /login que confunde al probe).
              path: /api/json
              port: 8080
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/json
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
          resources:
            # Produccion: jenkins con varios jobs + kaniko build+push
            # simultaneos + la JVM cargando plugins se acerca a 1.5Gi
            # facil. Ajustar si el cluster tiene menos memoria.
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
      volumes:
        - name: jenkins-home
          persistentVolumeClaim:
            claimName: jenkins-home
        - name: init-scripts
          configMap:
            name: jenkins-init-scripts
        - name: kaniko-bin
          emptyDir: {}
        - name: kaniko-work
          # emptyDir dedicado al staging dir de kaniko (/kaniko). Si lo
          # montamos sobre el mismo emptyDir que kaniko-bin se contamina
          # el dir de binarios. Mejor separado.
          emptyDir: {}
        - name: workspace
          # Donde el job clona el repo. emptyDir se pierde cuando el pod
          # muere: no queremos cache de build en el PV (sino el PVC se
          # llena rapido). Cada build empieza desde cero.
          emptyDir: {}
        - name: kaniko-cache
          # Cache de layers de kaniko. emptyDir esta bien para empezar;
          # migrar a PVC si la cache pasa a ser valiosa.
          emptyDir: {}
        - name: plugins-file
          configMap:
            name: jenkins-plugins
---
# Scripts Groovy que corren en el primer arranque (y en cada reinicio
# si el script es idempotente, que es lo que asumimos aca).
# Jenkins los carga desde $JENKINS_HOME/init.groovy.d/*.groovy.
#
# Los jobs reales (`laurel_<slug>`) los crea el backend al dar de alta
# una app en AppsService.create. Este ConfigMap solo deja Jenkins con
# la configuracion de seguridad minima necesaria para que el backend
# pueda disparar builds de forma anonima con build token.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-init-scripts
  namespace: prod
data:
  # 1) Deshabilita CSRF y deja la auth como UNSECURED.
  #    El backend hace GETs anonimos a /job/<job>/api/json (job_exists,
  #    get_build_status) y POSTs con ?token=<build_token> a
  #    /job/<job>/buildWithParameters. Ninguno requiere login.
  00-security.groovy: |
    import jenkins.model.Jenkins
    import hudson.security.AuthorizationStrategy

    def instance = Jenkins.getInstance()
    instance.setAuthorizationStrategy(AuthorizationStrategy.UNSECURED)
    instance.setSecurityRealm(new hudson.security.HudsonPrivateSecurityRealm(false))

    if (instance.getCrumbIssuer() != null) {
        instance.setCrumbIssuer(null)
        println "[init] CSRF deshabilitado"
    }
    instance.save()
    println "[init] Security: UNSECURED + crumb OFF"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-plugins
  namespace: prod
data:
  plugins.txt: |
    workflow-multibranch
    workflow-job
    workflow-cps
    workflow-step-api
    branch-api
    pipeline-stage-view
    pipeline-graph-analysis
    git
    scm-api
    script-security
    workflow-support
    blueocean
    blueocean-commons
    blueocean-rest
    blueocean-rest-impl
    blueocean-web
    blueocean-pipeline-api
    blueocean-pipeline-editor
    blueocean-dashboard
    blueocean-jwt
    blueocean-personalization
    blueocean-config
    blueocean-display-url
    blueocean-i18n
    blueocean-github-pipeline
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-home
  namespace: prod
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Ojo: k3s local-path NO soporta resize. Si subimos este valor y
      # el PVC ya existe con 10Gi, `kubectl apply` falla con
      # "only dynamically provisioned pvc can be resized". Para crecerlo,
      # primero `kubectl delete pvc jenkins-home -n prod` (asume que no
      # hay data critica) o migrar a un storage class que soporte resize.
      storage: 10Gi