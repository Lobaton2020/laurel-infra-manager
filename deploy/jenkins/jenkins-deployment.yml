apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  labels:
    app: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              echo "🔧 Arreglando permisos..."
              mkdir -p /var/jenkins_home
              chown -R 1000:1000 /var/jenkins_home
              chmod -R 755 /var/jenkins_home
              echo "✅ Permisos arreglados"
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
      containers:
        - name: jenkins
          image: jenkins/jenkins:lts-jdk17
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 50000
              name: agent
              protocol: TCP
          env:
            - name: JAVA_OPTS
              value: "-Djenkins.install.runSetupWizard=false -Dhudson.security.csrf.GlobalCrumbIssuerConfiguration.DISABLE_CSRF_PROTECTION=true -Xmx512m -Xms256m"
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
            - name: init-scripts
              mountPath: /var/jenkins_home/init.groovy.d
          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 150
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1.5Gi"
      volumes:
        - name: jenkins-home
          persistentVolumeClaim:
            claimName: jenkins-home
        - name: init-scripts
          configMap:
            name: jenkins-init-scripts
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-init-scripts
data:
  disable-csrf.groovy: |
    import jenkins.model.Jenkins
    import hudson.security.csrf.GlobalCrumbIssuerConfiguration

    def jenkins = Jenkins.getInstance()
    def crumbIssuer = jenkins.getCrumbIssuer()

    if (crumbIssuer != null) {
        println "Deshabilitando CSRF..."
        jenkins.setCrumbIssuer(null)
        jenkins.save()
        println "✅ CSRF DESHABILITADO"
    } else {
        println "ℹ️ CSRF ya estaba deshabilitado"
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-home
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi