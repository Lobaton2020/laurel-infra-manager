apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  labels:
    app: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      containers:
        - name: jenkins
          image: jenkins/jenkins:lts-jdk17
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50000
              name: agent
          env:
            - name: JAVA_OPTS
              value: "-Djenkins.install.runSetupWizard=false"
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
            - name: init-scripts
              mountPath: /var/jenkins_home/init.groovy.d
          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
      volumes:
        - name: jenkins-home
          persistentVolumeClaim:
            claimName: jenkins-home
        - name: init-scripts
          configMap:
            name: jenkins-init-scripts
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-init-scripts
data:
  disable-csrf.groovy: |
    import jenkins.model.Jenkins
    Jenkins.instance.setCrumbIssuer(null)
    Jenkins.instance.save()
    println "=== CSRF DESHABILITADO ==="