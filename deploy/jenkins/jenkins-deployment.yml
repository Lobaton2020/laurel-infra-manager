apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  labels:
    app: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      # Jenkins corre como uid 1000 dentro del contenedor y necesita
      # poder escribir en el volumen. Si el PV ya esta creado con otro
      # owner, el initContainer de fix-permissions lo corrige.
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          # Tag pinneado: `latest` rompe con frecuencia.
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Arreglando permisos del volumen..."
              mkdir -p /var/jenkins_home
              chown -R 1000:1000 /var/jenkins_home
              chmod -R 755 /var/jenkins_home
              echo "Permisos OK"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
      containers:
        - name: jenkins
          image: jenkins/jenkins:2.516.3-lts-jdk21
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 50000
              name: agent
              protocol: TCP
          env:
            - name: JAVA_OPTS
              # CSRF deshabilitado para que el backend pueda hacer POST sin crumb.
              # El auth real va por build token en query param (estrategia
              # documentada por Jenkins: "Trigger builds remotely").
              # Heap: 1g es lo minimo sano con varios jobs + plugins;
              # lo bajo a 768m solo si el nodo se queda corto.
              value: "-Djenkins.install.runSetupWizard=false -Dhudson.security.csrf.GlobalCrumbIssuerConfiguration.DISABLE_CSRF_PROTECTION=true -Xmx1024m -Xms512m"
            - name: JENKINS_OPTS
              # Sin auth global: el backend hace requests anonimas para
              # job_exists / get_build_status; el trigger usa build token.
              # Si en algun momento necesitamos agregar SSO, lo cambiamos
              # a un init.groovy que cree el realm + estrategia con permisos.
              value: "--httpPort=8080"
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
            - name: init-scripts
              mountPath: /var/jenkins_home/init.groovy.d
          readinessProbe:
            httpGet:
              # /api/json responde 200 cuando el server esta listo
              # (sin redirect a /login que confunde al probe).
              path: /api/json
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/json
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: "300m"
              memory: "768Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
      volumes:
        - name: jenkins-home
          persistentVolumeClaim:
            claimName: jenkins-home
        - name: init-scripts
          configMap:
            name: jenkins-init-scripts
---
# Scripts Groovy que corren en el primer arranque (y en cada reinicio
# si el script es idempotente, que es lo que asumimos aca).
# Jenkins los carga desde $JENKINS_HOME/init.groovy.d/*.groovy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-init-scripts
data:
  # 1) Deshabilita CSRF y deja la auth como UNSECURED.
  #    El backend hace GETs anonimos a /job/<job>/api/json (job_exists,
  #    get_build_status) y POSTs con ?token=<build_token> a
  #    /job/<job>/buildWithParameters. Ninguno requiere login.
  00-security.groovy: |
    import jenkins.model.Jenkins
    import hudson.security.AuthorizationStrategy

    def instance = Jenkins.getInstance()
    instance.setAuthorizationStrategy(AuthorizationStrategy.UNSECURED)
    instance.setSecurityRealm(new hudson.security.HudsonPrivateSecurityRealm(false))

    if (instance.getCrumbIssuer() != null) {
        instance.setCrumbIssuer(null)
        println "[init] CSRF deshabilitado"
    }
    instance.save()
    println "[init] Security: UNSECURED + crumb OFF"

  # 2) Crea el job `laurel_demo` para dev/smoke tests apenas Jenkins
  #    levanta. El backend NO crea jobs en el flujo real: cuando el
  #    operador da de alta una app, debe crear el job `laurel_<slug>`
  #    en Jenkins con los parametros y un build token, y guardar ese
  #    token en el secreto k8s `laurel-integrations` (key `jenkins-token`).
  #    Este init script solo automatiza el caso demo.
  #
  #    El job corre un pipeline CI/CD de 3 stages con `set -e`:
  #      1. Unit tests (`eval "$TEST_CMD"`)  -> si falla, no se buildea.
  #      2. Build image (`docker build -t $IMAGE .`) -> placeholder.
  #      3. Push image (`docker push $IMAGE`)        -> placeholder.
  #    TEST_CMD llega del backend (campo applications.test_cmd); si
  #    llega vacio se usa el default del job (echo "no tests").
  10-bootstrap-jobs.groovy: |
    import jenkins.model.Jenkins
    import hudson.model.FreeStyleProject
    import hudson.model.ParametersDefinitionProperty
    import hudson.model.StringParameterDefinition
    import hudson.tasks.Shell
    import hudson.model.BuildAuthorizationTokenProperty

    def jenkins = Jenkins.getInstance()
    def jobName = "laurel_demo"
    def token = "laurel-test-token-2026"

    if (jenkins.getItem(jobName) != null) {
        println "[init] job ${jobName} ya existe, skip"
        return
    }

    def job = jenkins.createProject(FreeStyleProject, jobName)
    job.description = "Demo build job. Pipeline CI/CD de 3 stages: tests -> build -> push."

    def params = new ParametersDefinitionProperty([
        new StringParameterDefinition("SLUG", "demo", "slug de la app"),
        new StringParameterDefinition("TAG",  "0.0.1", "tag/version a buildear"),
        new StringParameterDefinition("REPO", "laurel-applications/laurel_demo", "repo GitHub"),
        new StringParameterDefinition("IMAGE", "aflobaton/laurel_demo:0.0.1", "imagen Docker destino"),
        new StringParameterDefinition(
            "TEST_CMD", "echo '[demo] no tests configured - placeholder OK'",
            "comando a correr en STAGE 1 (unit tests). Default placeholder; " +
            "para apps reales pasar el comando real (ej 'pytest tests/', 'npm test')."
        ),
    ])
    job.addProperty(params)

    // Pipeline de 3 stages con `set -e`: si los tests fallan, NO se
    // intenta buildear. Los steps 2 y 3 son placeholders porque el
    // pod de Jenkins no tiene docker; un job real debe reemplazar las
    // lineas marcadas con `would run:` por los comandos reales.
    def shell = new Shell(
        'set -e\n' +
        'echo "========================================="\n' +
        'echo "STAGE 1/3: Unit tests"\n' +
        'echo "SLUG=${SLUG}  TAG=${TAG}"\n' +
        'echo "========================================="\n' +
        'eval "${TEST_CMD}"\n' +
        'echo "TESTS OK"\n' +
        'echo "========================================="\n' +
        'echo "STAGE 2/3: Build image"\n' +
        'echo "Image: ${IMAGE}"\n' +
        'echo "========================================="\n' +
        'echo "(would run: docker build -t ${IMAGE} .)"\n' +
        'echo "BUILD OK"\n' +
        'echo "========================================="\n' +
        'echo "STAGE 3/3: Push image to registry"\n' +
        'echo "========================================="\n' +
        'echo "(would run: docker push ${IMAGE})"\n' +
        'echo "PUSH OK"\n' +
        'echo "PIPELINE COMPLETE"\n' +
        'exit 0\n'
    )
    job.getBuildersList().add(shell)

    // Build token: API Java estable, sin tocar XML a mano.
    job.addProperty(new BuildAuthorizationTokenProperty(token))
    job.save()
    println "[init] job ${jobName} creado con build token '${token}'"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-home
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Ojo: k3s local-path NO soporta resize. Si subimos este valor y
      # el PVC ya existe con 10Gi, `kubectl apply` falla con
      # "only dynamically provisioned pvc can be resized". Para crecerlo,
      # primero `kubectl delete pvc jenkins-home -n prod` (asume que no
      # hay data critica) o migrar a un storage class que soporte resize.
      storage: 10Gi
