apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: laurel-api-ingress
  namespace: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Importante: GitHub firma el body con HMAC-SHA256. Traefik por default
    # re-bufea el body y eso cambia los bytes, rompiendo la firma. Estas
    # annotations de Traefik le dicen que NO toque el body en este path.
    traefik.ingress.kubernetes.io/request.size: "0"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - laurel-api.andreslobaton.top
      secretName: laurel-api-tls
  rules:
    - host: laurel-api.andreslobaton.top
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: laurel-infra-manager
                port:
                  number: 3006
