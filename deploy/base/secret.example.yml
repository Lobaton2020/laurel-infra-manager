# Template de los Secrets que debes crear a mano antes de
# `kubectl apply -k deploy/overlays/prod`.
#
# 1. laurel-secrets (REQUERIDO) - un `.env` con las variables del proyecto.
#
#    Crealo localmente con:
#      kubectl create secret generic laurel-secrets \
#        --from-file=.env=./.env \
#        -n prod
#
#    El .env debe contener (mismas que config.py, ver .env.example):
#      # --- Base de datos (MySQL/MariaDB en el VPS) ---
#      DB_TYPE=mysql
#      MYSQL_HOST=192.168.20.240
#      MYSQL_PORT=3306
#      MYSQL_USER=root
#      MYSQL_PASSWORD=<password>
#      MYSQL_DATABASE=orchestrator
#
#      # --- Auth Google (debe coincidir con el Client ID del front) ---
#      GOOGLE_CLIENT_ID=<google-client-id>
#      SECRET_KEY=<>=32 chars aleatorios>
#      JWT_TTL_HOURS=24
#      AUTH_ALLOWED_ORIGINS=http://localhost:5173,http://192.168.20.240:5173
#
#      # --- Cluster K8s (la API gestiona el cluster via este kubeconfig) ---
#      KUBECONFIG_PATH=./k3s.yaml
#      K8S_API_SERVER=https://192.168.20.240:6443
#      K8S_VERIFY_SSL=true
#      DEFAULT_NAMESPACE=user-apps
#      INGRESS_BASE_DOMAIN=andreslobaton.top
#      ...
#
#    Nota: el pod monta este .env en /app/.env; config.py lo lee al arrancar.
#
# 2. laurel-kubeconfig (REQUERIDO) - kubeconfig del cluster para que la API
#    hable con Kubernetes (consulta/crea Deployments, Services, Ingresses...).
#
#      kubectl create secret generic laurel-kubeconfig \
#        --from-file=k3s.yaml=./k3s.yaml \
#        -n prod
#
#    El pod lo monta en /app/k3s.yaml. NO lo subas a git (esta en .gitignore).