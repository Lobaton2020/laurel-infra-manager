name: Build and Push Docker Image

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

env:
  IMAGE_NAME: aflobaton/laurel-infra-manager

jobs:
  docker:
    runs-on: ubuntu-latest

    # Explicit permissions: required for `cache-to: type=gha`.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Mostrar contexto
        run: |
          echo "Event:  ${{ github.event_name }}"
          echo "Ref:    ${{ github.ref }}"
          echo "Repo:   ${{ github.repository }}"
          echo "Rama:   ${{ github.ref_name }}"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar secrets de Docker Hub
        if: github.event_name == 'push'
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error title=Secrets faltantes::Define DOCKERHUB_USERNAME y DOCKERHUB_TOKEN en Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Iniciar sesion en Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Crear metadata de imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=pr,prefix=pr-

      - name: Construir y empujar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen de tags publicados
        if: github.event_name == 'push'
        run: echo "Tags -> ${{ steps.meta.outputs.tags }}"